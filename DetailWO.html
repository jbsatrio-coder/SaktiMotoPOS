<body class="p-4">


<div class="card shadow">


  <!-- HEADER -->

  <div class="card-header bg-danger text-white">

    <h4 class="mb-0">

      <i class="bi bi-tools"></i>

      DETAIL WORK ORDER

    </h4>

  </div>


  <div class="card-body">


    <!-- =========================
         IDENTITAS WO
    ========================== -->

    <h3
      id="noWO"
      class="fw-bold text-danger">
    </h3>

    <hr>


    <div class="row g-3">


      <div class="col-md-6">

        <div class="info-label">

        </div>

        <div
          id="nama"
          class="info-value">
        </div>

      </div>


      <div class="col-md-6">

      <div class="col-md-6">

        <div

        </div>

      </div>


      <div class="col-md-6">

        <div class="info-label">

        </div>

        <div
          id="status"

        </div>

      </div>


    </div>


    <hr>


    <!-- =========================

    <h5 class="fw-bold mb-3">

    </h5>


    <div id="listJasa">

      <div class="text-muted">

      </div>

    </div>


    <hr>


    <!-- =========================

    ========================== -->

    <div class="mb-3">

      <label class="form-label fw-semibold">
        Status Work Order
      </label>

      <select
        id="statusWO"
        class="form-select">

        <option value="MENUNGGU">
          MENUNGGU
        </option>

        <option value="DIAGNOSA">
          DIAGNOSA
        </option>

        <option value="MENUNGGU APPROVAL">
          MENUNGGU APPROVAL
        </option>

        <option value="PROSES">
          PROSES
        </option>

        <option value="QC">
          QC
        </option>

        <option value="SIAP DIAMBIL">
          SIAP DIAMBIL
        </option>

        <option value="SELESAI">
          SELESAI
        </option>

      </select>

    </div>


    <!-- =========================
         MEKANIK
    ========================== -->

    <div class="mb-3">

      <label class="form-label fw-semibold">

      <select

    <!-- =========================
         BUTTON
    ========================== -->

    <button
      class="btn btn-danger w-100"
      onclick="simpanPerubahan()">

      <i class="bi bi-floppy"></i>

    </button>


  </div>

</div>


<script>


const noWO =
  "<?= noWO ?>";


/**
 * ============================================
 * LOAD DETAIL WO
 * ============================================
 */

function loadDetailWO(){

  google.script.run

    .withSuccessHandler(
      function(data){

        if(!data){

          alert(
            "Work Order tidak ditemukan."
          );

          return;

        }


        // =========================
        // IDENTITAS WO
        // =========================

        document
          .getElementById("noWO")
          .innerText =
            data.noWO || "";


        document
          .getElementById("nama")
          .innerText =
            data.nama || "-";


        document
          .getElementById("plat")
          .innerText =
            data.plat || "-";


        document
          .getElementById("kendaraan")
          .innerText =
            (
              (data.merk || "") +
              " " +
              (data.model || "")
            ).trim() || "-";


        document
          .getElementById("status")
          .innerText =
            data.status || "-";


        document
          .getElementById("statusWO")
          .value =
            data.status || "";


        // =========================
        // JASA
        // =========================

        renderJasa(
          data.jasa || []
        );


        // =========================
        // MEKANIK
        // =========================

        loadMekanik(
          data.jasa || []
        );

      }
    )

    .withFailureHandler(
      function(err){

        alert(
          "Gagal mengambil Work Order:\n" +
          err.message
        );

      }
    )

    .getWorkOrder(noWO);

}


/**
 * ============================================
 * RENDER JASA
 * ============================================
 */

function renderJasa(jasa){

  const container =
    document.getElementById(
      "listJasa"
    );


  container.innerHTML = "";


  if(
    !jasa ||
    jasa.length === 0
  ){

    container.innerHTML = `

      <div class="alert alert-warning">

        Belum ada pekerjaan / jasa.

      </div>

    `;

    return;

  }


  jasa.forEach(
    function(item, index){

      const status =
        String(
          item.status || ""
        ).toUpperCase();


      const statusClass =
        status === "DONE"
          ? "bg-success text-white"
          :
        status === "CANCEL"
          ? "bg-secondary text-white"
          :
        "bg-warning text-dark";


      container.innerHTML += `

        <div class="jasa-card">

          <div class="d-flex justify-content-between align-items-start">

            <div>

              <div class="jasa-title">

                ${index + 1}.
                ${escapeHtml(
                  item.namaJasa || "-"
                )}

              </div>

              <div class="jasa-meta">

                Qty:
                ${escapeHtml(
                  item.qty || "0"
                )}

              </div>

            </div>

            <span
              class="status-badge ${statusClass}">

              ${escapeHtml(
                status || "-"
              )}

            </span>

          </div>


          <hr>


          <div class="mb-3">

            <div class="field-label">
              KELUHAN
            </div>

            <div class="field-value">

              ${escapeHtml(
                item.keluhan || "-"
              )}

            </div>

          </div>


          <div class="mb-3">

            <div class="field-label">
              DIAGNOSA
            </div>

            <div class="field-value">

              ${escapeHtml(
                item.diagnosa || "-"
              )}

            </div>

          </div>


          <div>

            <div class="field-label">
              MEKANIK
            </div>

            <div class="field-value">

              ${escapeHtml(
                item.mekanik || "-"
              )}

            </div>

          </div>

        </div>

      `;

    }
  );

}


/**
 * ============================================
 * LOAD MEKANIK
 * ============================================
 */

function loadMekanik(jasa){

  google.script.run

    .withSuccessHandler(
      function(data){

        const select =
          document.getElementById(
            "mekanik"
          );


        select.innerHTML = "";


        const kosong =
          document.createElement(
            "option"
          );

        kosong.value = "";

        kosong.textContent =
          "-- Pilih Mekanik --";

        select.appendChild(
          kosong
        );


        data.forEach(
          function(r){

            const opt =
              document.createElement(
                "option"
              );

            opt.value =
              r[0];

            opt.textContent =
              r[1];

            select.appendChild(
              opt
            );

          }
        );


        /*
         * Jika ada satu mekanik
         * pada jasa aktif, pilih otomatis.
         */

        const active =
          jasa.find(
            function(x){

              return (
                x.status !== "CANCEL" &&
                x.mekanikId
              );

            }
          );


        if(active){

          select.value =
            active.mekanikId;

        }

      }
    )

    .withFailureHandler(
      function(err){

        console.error(
          "Gagal memuat mekanik:",
          err
        );

      }
    )

    .getMasterMekanik();

}


/**
 * ============================================
 * SIMPAN PERUBAHAN
 * ============================================
 */

function simpanPerubahan(){

  const data = {

    noWO:
      document
        .getElementById("noWO")
        .innerText,

    diagnosa:
      "",

    status:
      document
        .getElementById("statusWO")
        .value,

    idMekanik:
      document
        .getElementById("mekanik")
        .value

  };


  google.script.run

    .withSuccessHandler(
      function(){

        alert(
          "✅ Perubahan berhasil disimpan."
        );

        google.script.host.close();

      }
    )

    .withFailureHandler(
      function(err){

        alert(
          err.message
        );

      }
    )

    .updateWorkOrder(
      data
    );

}


/**
 * ============================================
 * ESCAPE HTML
 * ============================================
 */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/**
 * ============================================
 * START
 * ============================================
 */

loadDetailWO();


</script>
