<script>

  /**
 * ============================================

let vehicleMerkLoaded = false;


/**
 * ============================================
 * BUKA OVERLAY KENDARAAN
 * ============================================
 */

function tambahKendaraanBaru(){

  const customerId =
    document
      .getElementById("idPelanggan")
      .value
      .trim();

  if(!customerId){

    alert(
      "Pilih pelanggan terlebih dahulu."
    );

    return;

  }


  const overlay =
    document.getElementById(
      "vehicleOverlay"
    );

  if(!overlay){

    alert(
      "Vehicle overlay tidak ditemukan."
    );

    return;

  }


  overlay.style.display =
    "block";


  /*
   * Reset form.
   */

  document.getElementById(
    "vehiclePlat"
  ).value = "";

  document.getElementById(
    "vehicleTahun"
  ).value = "";

  document.getElementById(
    "vehicleWarna"
  ).value = "";

  document.getElementById(
    "vehicleNoMesin"
  ).value = "";

  document.getElementById(
    "vehicleNoRangka"
  ).value = "";

  document.getElementById(
    "vehicleStatus"
  ).innerHTML = "";


  const model =
    document.getElementById(
      "vehicleModel"
    );

  model.innerHTML =
    '<option value="">Pilih Merk terlebih dahulu</option>';

  model.disabled =
    true;


  loadVehicleMerk();

}


/**
 * ============================================
 * TUTUP OVERLAY
 * ============================================
 */

function tutupVehicleOverlay(){

  const overlay =
    document.getElementById(
      "vehicleOverlay"
    );

  if(overlay){

    overlay.style.display =
      "none";

  }

}


/**
 * ============================================
 * LOAD MASTER MERK
 * ============================================
 */

function loadVehicleMerk(){

  const select =
    document.getElementById(
      "vehicleMerk"
    );

  select.innerHTML =
    '<option value="">Memuat Merk...</option>';

  select.disabled =
    true;


  google.script.run

    .withSuccessHandler(
      function(data){

        const daftar =
          data || [];

        select.innerHTML =
          '<option value="">-- Pilih Merk --</option>';

        daftar.forEach(
          function(item){

            const option =
              document.createElement(
                "option"
              );

            option.value =
              item.id || "";

            option.textContent =
              item.nama || "";

            select.appendChild(
              option
            );

          }
        );

        select.disabled =
          false;

      }
    )

    .withFailureHandler(
      function(error){

        select.innerHTML =
          '<option value="">Gagal memuat Merk</option>';

        select.disabled =
          true;

        document.getElementById(
          "vehicleStatus"
        ).innerHTML =
          "Gagal memuat Master Merk: " +
          (
            error.message ||
            error
          );

      }
    )

    .getMasterMerkKendaraan();

}


/**
 * ============================================
 * LOAD MODEL BERDASARKAN MERK
 * ============================================
 */

function loadVehicleModel(){

  const merkId =
    document
      .getElementById(
        "vehicleMerk"
      )
      .value;

  const select =
    document.getElementById(
      "vehicleModel"
    );


  select.innerHTML =
    '<option value="">Memuat Model...</option>';

  select.disabled =
    true;


  if(!merkId){

    select.innerHTML =
      '<option value="">Pilih Merk terlebih dahulu</option>';

    return;

  }


  google.script.run

    .withSuccessHandler(
      function(data){

        const models =
          data || [];

        select.innerHTML =
          '<option value="">-- Pilih Model --</option>';


        models.forEach(
          function(item){

            const option =
              document.createElement(
                "option"
              );

            option.value =
              item.id || "";

            option.textContent =
              item.nama || "";

            select.appendChild(
              option
            );

          }
        );


        select.disabled =
          false;

      }
    )

    .withFailureHandler(
      function(error){

        select.innerHTML =
          '<option value="">Gagal memuat Model</option>';

        select.disabled =
          true;

        document.getElementById(
          "vehicleStatus"
        ).innerHTML =
          "Gagal memuat Master Model: " +
          (
            error.message ||
            error
          );

      }
    )

    .getMasterModelKendaraan(
      merkId
    );

}


/**
 * ============================================
 * SIMPAN KENDARAAN DARI WORK ORDER
 * ============================================
 */

function simpanVehicleDariWO(){

  const customerId =
    document
      .getElementById(
        "idPelanggan"
      )
      .value
      .trim();


  const merkSelect =
    document.getElementById(
      "vehicleMerk"
    );

  const modelSelect =
    document.getElementById(
      "vehicleModel"
    );


  const data = {

    customerId :
      customerId,

    plat :
      document
        .getElementById(
          "vehiclePlat"
        )
        .value,

    merk :
      merkSelect
        .selectedOptions[0]
        ?.textContent || "",

    merkId :
      merkSelect.value,

    model :
      modelSelect
        .selectedOptions[0]
        ?.textContent || "",

    modelId :
      modelSelect.value,

    tahun :
      document
        .getElementById(
          "vehicleTahun"
        )
        .value,

    warna :
      document
        .getElementById(
          "vehicleWarna"
        )
        .value,

    noMesin :
      document
        .getElementById(
          "vehicleNoMesin"
        )
        .value,

    noRangka :
      document
        .getElementById(
          "vehicleNoRangka"
        )
        .value

  };


  const status =
    document.getElementById(
      "vehicleStatus"
    );

  const tombol =
    document.getElementById(
      "btnSimpanVehicle"
    );


  /*
   * ==========================================
   * VALIDASI
   * ==========================================
   */

  if(!data.customerId){

    status.innerHTML =
      "Customer belum dipilih.";

    return;

  }


  if(!data.plat.trim()){

    status.innerHTML =
      "Plat nomor wajib diisi.";

    return;

  }


  if(!data.merkId){

    status.innerHTML =
      "Merk wajib dipilih.";

    return;

  }


  if(!data.modelId){

    status.innerHTML =
      "Model wajib dipilih.";

    return;

  }


  tombol.disabled =
    true;

  status.innerHTML =
    "Menyimpan kendaraan...";


  /*
   * ==========================================
   * CREATE VEHICLE
   * ==========================================
   */

  google.script.run

    .withSuccessHandler(
      function(result){

        /*
         * Kendaraan berhasil dibuat.
         *
         * Langsung masukkan ke Work Order.
         */

        pilihKendaraan({

          idKendaraan :
            result.idKendaraan ||
            result.vehicleId ||
            "",

          idPelanggan :
            result.customerId ||
            customerId,

          nama :
            document
              .getElementById(
                "namaPelanggan"
              )
              .value || "",

          noHp :
            document
              .getElementById(
                "nohp"
              )
              .value || "",

          plat :
            result.plat ||
            data.plat,

          merk :
            result.merk ||
            data.merk,

          model :
            result.model ||
            data.model,

          kilometer :
            ""

        });


        status.innerHTML =
          "Kendaraan berhasil ditambahkan.";


        /*
         * Tutup overlay.
         */

        setTimeout(
          function(){

            tutupVehicleOverlay();

          },
          250
        );


      }
    )

    .withFailureHandler(
      function(error){

        status.innerHTML =
          "Gagal: " +
          (
            error.message ||
            error
          );

        tombol.disabled =
          false;

      }
    )

    .simpanKendaraanBaru(
      data
    );

}

function cariPlat() {

  const plat =
    document.getElementById("platNomor").value.trim();

  if(!plat){

    alert("Nomor polisi belum diisi.");

    return;

  }

  google.script.run

    .withSuccessHandler(function(data){

      if(!data){

        alert("Plat nomor tidak ditemukan.");

        return;

      }

      document.getElementById("namaPelanggan").value =
        data.nama || "";

      document.getElementById("nohp").value = data.nohp || "";

      document.getElementById("kendaraan").value =
        (data.merk || "") +
        " " +
        (data.model || "");

      document.getElementById("idPelanggan").value =
        data.idPelanggan || "";

      document.getElementById("idKendaraan").value =
        data.idKendaraan || "";

      document.getElementById("platNomor").value =
        data.plat || plat;

      if(document.getElementById("km")){

        document.getElementById("km").value =
          data.kilometer || "";

      }

    })

    .withFailureHandler(function(err){

      alert(
        "ERROR: " +
        (err.message || err)
      );

    })

    .findKendaraanByPlat(plat);

}

/**
 * ============================================
 * TAMBAH PELANGGAN BARU
 * ============================================
 */

let pendingCustomerPoll = null;

let pendingCustomerRequest = false;


function tambahPelangganBaru(){

  /*
   * Hentikan polling sebelumnya jika ada.
   */

  if(pendingCustomerPoll){

    clearInterval(
      pendingCustomerPoll
    );

    pendingCustomerPoll = null;

  }


  /*
   * Buka FormPelanggan dengan context
   * WORK_ORDER.
   */

  google.script.run

    .withSuccessHandler(
      function(){

        mulaiPollingCustomerBaru();

      }
    )

    .withFailureHandler(
      function(error){

        alert(
          "Gagal membuka Form Pelanggan:\n\n" +
          (
            error.message ||
            error
          )
        );

      }
    )

    .bukaFormPelangganDariWorkOrder();

}


/**
 * ============================================
 * POLLING HASIL CUSTOMER BARU
 * ============================================
 */

function mulaiPollingCustomerBaru(){

  pendingCustomerPoll =
    setInterval(
      cekPendingCustomerBaru,
      700
    );

}


/**
 * ============================================
 * CEK CUSTOMER BARU
 * ============================================
 */

function cekPendingCustomerBaru(){

  /*
   * Jangan membuat request bertumpuk.
   */

  if(pendingCustomerRequest){

    return;

  }


  pendingCustomerRequest = true;


  google.script.run

    .withSuccessHandler(
      function(data){

        pendingCustomerRequest =
          false;


        if(!data){

          return;

        }


        /*
         * Customer berhasil dibuat.
         * Isi otomatis Work Order.
         */

        isiCustomerBaruKeWorkOrder(
          data
        );


        /*
         * Hentikan polling.
         */

        if(pendingCustomerPoll){

          clearInterval(
            pendingCustomerPoll
          );

          pendingCustomerPoll = null;

        }

      }
    )

    .withFailureHandler(
      function(){

        pendingCustomerRequest =
          false;

      }
    )

    .getPendingWorkOrderCustomer();

}


/**
 * ============================================
 * ISI CUSTOMER BARU KE WORK ORDER
 * ============================================
 */

function isiCustomerBaruKeWorkOrder(data){

  document
    .getElementById("idPelanggan")
    .value =
      data.customerId || "";


  document
    .getElementById("idKendaraan")
    .value =
      data.vehicleId || "";


  document
    .getElementById("namaPelanggan")
    .value =
      data.nama || "";


  document
    .getElementById("nohp")
    .value =
      data.noHP || "";


  document
    .getElementById("platNomor")
    .value =
      data.plat || "";


  document
    .getElementById("kendaraan")
    .value =
      (
        (data.merk || "") +
        " " +
        (data.model || "")
      ).trim();


  /*
   * KM kendaraan baru dimulai dari 0.
   * Jangan menimpa jika nanti kita mengubah
   * mekanisme ini untuk mengambil KM aktual.
   */

  const km =
    document.getElementById("km");


  if(km){

    km.value = "";

  }


  /*
   * Pastikan hasil pencarian lama hilang.
   */

  const hasil =
    document.getElementById(
      "hasilCari"
    );


  if(hasil){

    hasil.style.display =
      "none";

    hasil.innerHTML =
      "";

  }

}

/**

 */

/**
 * ============================================
 * TAMBAH KENDARAAN BARU
 * DARI WORK ORDER
 * ============================================
 */

let pendingVehiclePoll = null;
let pendingVehicleRequest = false;


/**
 * ============================================
 * TAMBAH KENDARAAN BARU
 * DARI WORK ORDER
 * ============================================
 */

/**
 * ============================================
 * POLLING KENDARAAN BARU
 * ============================================
 */

function mulaiPollingKendaraanBaru(){

  pendingVehiclePoll =
    setInterval(
      cekPendingKendaraanBaru,
      700
    );

}


/**
 * ============================================
 * CEK KENDARAAN BARU
 * ============================================
 */

function cekPendingKendaraanBaru(){

  /*
   * Jangan membuat request bertumpuk.
   */

  if(pendingVehicleRequest){

    return;

  }

  pendingVehicleRequest = true;

  google.script.run

    .withSuccessHandler(
      function(data){

        pendingVehicleRequest =
          false;

        if(!data){

          return;

        }

        /*
         * Pastikan kendaraan memang milik
         * customer yang sedang dipakai WO.
         */

        const currentCustomerId =
          document
            .getElementById("idPelanggan")
            .value
            .trim();

        if(
          data.customerId &&
          currentCustomerId &&
          String(data.customerId).trim() !==
          currentCustomerId
        ){

          console.warn(
            "Pending vehicle bukan milik customer aktif."
          );

          return;

        }

        /*
         * Bentuk data agar kompatibel dengan
         * pilihKendaraan().
         */

        pilihKendaraan({

          idKendaraan :
            data.vehicleId || "",

          idPelanggan :
            data.customerId || "",

          nama :
            document
              .getElementById("namaPelanggan")
              .value || "",

          noHp :
            document
              .getElementById("nohp")
              .value || "",

          plat :
            data.plat || "",

          merk :
            data.merk || "",

          model :
            data.model || "",

          kilometer :
            ""

        });

        /*
         * Hentikan polling.
         */

        if(pendingVehiclePoll){

          clearInterval(
            pendingVehiclePoll
          );

          pendingVehiclePoll = null;

        }

      }
    )

    .withFailureHandler(
      function(err){

        pendingVehicleRequest =
          false;

        console.error(
          "Gagal mengambil kendaraan baru:",
          err
        );

      }
    )

    .getPendingWorkOrderVehicle();

}



/**
 * ============================================
 * SEARCH KENDARAAN
 * ============================================
 */

let searchKendaraanRequest = 0;
function cariKendaraan(){

  const keyword =
    document
      .getElementById("platNomor")
      .value
      .trim();

  if(keyword === ""){

    return;

  }

  const requestId =
    ++searchKendaraanRequest;


  google.script.run

    .withSuccessHandler(
      function(list){

        /*
         * Abaikan response pencarian
         * yang sudah tidak relevan.
         */
        if(
          requestId !==
          searchKendaraanRequest
        ){

          return;

        }

        renderHasilCari(list);

      }
    )

    .withFailureHandler(
      function(err){

        console.error(err);

      }
    )

    .searchKendaraan(keyword);

}


/**
 * ============================================
 * LOAD MEKANIK
 * ============================================
 *
 * Untuk tahap ini mekanik masih ditampilkan
 * di form, tetapi BELUM disimpan ke header WO.
 *
 * Mekanik nantinya disimpan pada
 * WorkOrderJasa.
 * ============================================
 */

function loadMekanik(){

  google.script.run

    .withSuccessHandler(
      function(data){

        renderMekanik(data);

      }
    )

    .withFailureHandler(
      function(err){

        alert(
          err.message || err
        );

      }
    )

    .getMasterMekanik();

}


function renderMekanik(data){

  const select =
    document.getElementById("mekanik");

  select.innerHTML = "";

  const kosong =
    document.createElement("option");

  kosong.value = "";

  kosong.textContent =
    "-- Pilih Mekanik --";

  select.appendChild(kosong);

  data.forEach(
    function(row){

      const option =
        document.createElement("option");

      option.value =
        row[0];

      option.textContent =
        row[1];

      select.appendChild(option);

    }
  );

}


/**
 * ============================================
 * RENDER HASIL PENCARIAN
 * ============================================
 */

function renderHasilCari(list){

  const box =
    document.getElementById(
      "hasilCari"
    );

  box.innerHTML = "";

  if(!list || list.length === 0){

    box.style.display =
      "none";

    return;

  }

  box.style.display =
    "block";

  list.forEach(
    function(item){

      const div =
        document.createElement("div");

      div.style.padding =
        "10px";

      div.style.cursor =
        "pointer";

      div.style.borderBottom =
        "1px solid #eeeeee";

      div.innerHTML =

        "<div style='font-weight:bold'>" +
        (item.nama || "") +
        "</div>" +

        "<div style='font-size:13px;color:#666'>" +

        (item.plat || "") +

        " • " +

        (item.merk || "") +

        " " +

        (item.model || "") +

        "</div>";

      div.onmouseover =
        function(){

          div.style.background =
            "#f5f5f5";

        };

      div.onmouseout =
        function(){

          div.style.background =
            "white";

        };

      div.onclick =
        function(){

          pilihKendaraan(item);

        };

      box.appendChild(div);

    }
  );

}


/**
 * ============================================
 * PILIH KENDARAAN
 * ============================================
 */

function pilihKendaraan(data){

  /*

   * Membatalkan response pencarian

   * yang masih berjalan.

   */

  searchKendaraanRequest++;

  document.getElementById("platNomor").value =
    data.plat || "";

  document.getElementById("idPelanggan").value =
    data.idPelanggan || "";

  document.getElementById("idKendaraan").value =
    data.idKendaraan || "";

  document.getElementById("namaPelanggan").value =
    data.nama || "";

  document.getElementById("nohp").value =
    data.noHp || ""; 

  document.getElementById("kendaraan").value =
    (
      (data.merk || "") +
      " " +
      (data.model || "")
    ).trim();

  document.getElementById("km").value =
    data.kilometer || "";

  document.getElementById("hasilCari").style.display =
    "none";

  /*
   * Customer sudah dipilih.
   * Izinkan user menambahkan kendaraan baru
   * untuk customer tersebut.
   */

  const btnTambahKendaraan =
    document.getElementById(
      "btnTambahKendaraan"
    );

  if(btnTambahKendaraan){

    btnTambahKendaraan.style.display =
      "block";

  }

}


/**
 * ============================================
 * SIMPAN WORK ORDER
 * ============================================
 *
 * MENGGUNAKAN ARSITEKTUR BARU:
 *
 * Form
 *   ↓
 * WorkOrderService.create()
 *   ↓
 * WorkOrderDocument
 *   ↓
 * WorkOrderRepository
 *   ↓
 * 17_WorkOrder
 *
 * TIDAK LAGI:
 *
 * saveWorkOrder()
 *
 * ============================================
 */

let isSavingWorkOrder = false;

function simpanWorkOrder(){

  // ============================================
  // CEGAH DOUBLE CLICK
  // ============================================

  if(isSavingWorkOrder){

    return;

  }


  // ============================================
  // AMBIL DATA FORM
  // ============================================

  const customerId =
    document
      .getElementById("idPelanggan")
      .value
      .trim();


  const vehicleId =
    document
      .getElementById("idKendaraan")
      .value
      .trim();


  const km =
    document
      .getElementById("km")
      .value;


  const prioritas =
    document
      .getElementById("prioritas")
      .value;


  const catatan =
    document
      .getElementById("catatan")
      .value
      .trim();


  const keluhan =
    document
      .getElementById("keluhan")
      .value
      .trim();


  // ============================================
  // VALIDASI FORM
  // ============================================

  if(!customerId){

    alert(
      "Pelanggan belum dipilih."
    );

    return;

  }


  if(!vehicleId){

    alert(
      "Kendaraan belum dipilih."
    );

    return;

  }


  // ============================================
  // MULAI PROSES SIMPAN
  // ============================================

  isSavingWorkOrder = true;


  const btn =
    document.getElementById("btnSimpanWO");


  if(btn){

    btn.disabled = true;

    btn.dataset.originalText =
      btn.innerHTML;

    btn.innerHTML =
      "⏳ MENYIMPAN...";

  }


  /**
   * ========================================
   * CATATAN SEMENTARA
   * ========================================
   *
   * Schema 17_WorkOrder baru tidak mempunyai
   * kolom Keluhan.
   *
   * Keluhan secara arsitektur akan disimpan
   * pada 18_WorkOrderJasa.
   *
   * Karena form jasa belum menjadi bagian
   * dari tahap ini, keluhan kita pertahankan
   * sementara di Catatan agar TIDAK HILANG.
   *
   * Nanti saat Detail WO sudah menggunakan
   * WorkOrderJasa, bagian ini akan dipindahkan
   * ke mekanisme yang benar.
   * ========================================
   */

  let finalCatatan =
    catatan;


  if(keluhan){

    finalCatatan =

      "Keluhan: " +
      keluhan +
      (
        catatan
          ? "\nCatatan: " + catatan
          : ""
      );

  }


  /**
   * ========================================
   * REQUEST CANONICAL
   * ========================================
   */

  const request = {

    customerId :
      customerId,

    vehicleId :
      vehicleId,

    kilometerMasuk :
      Number(km || 0),

    prioritas :
      prioritas,

    catatan :
      finalCatatan,

    jenisTransaksi :
      "SERVICE",

    admin :
      ""

  };


  /**
   * ========================================
   * SIMPAN
   * ========================================
   */

  google.script.run

   .withSuccessHandler(
  function(result){

    google.script.run
      .withSuccessHandler(
        function(){

          google.script.host.close();

        }
      )
      .withFailureHandler(
        function(){

          /*
           * Jika notifikasi gagal dicatat,
           * WO tetap sudah berhasil dibuat.
           * Jadi form tetap ditutup.
           */

          google.script.host.close();

        }
      )
      .setPendingWorkOrderToast(
        result.workOrderId
      );

  }
)

    .withFailureHandler(
  function(err){

    isSavingWorkOrder = false;

    const btn =
      document.getElementById("btnSimpanWO");

    btn.disabled = false;

    btn.textContent =
      "SIMPAN WORK ORDER";

    alert(
      "❌ Gagal membuat Work Order\n\n" +
      (
        err.message ||
        err
      )
    );

  }
)

   .createWorkOrder(
  request
);

}



</script>
