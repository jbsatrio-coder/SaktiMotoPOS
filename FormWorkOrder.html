<!DOCTYPE html>
<html>

<head>

<base target="_top">

<meta charset="UTF-8">

<?!= include("Bootstrap"); ?>

<?!= include("WorkOrderCSS"); ?>

</head>

<body>

<div class="card">

<h2>WORK ORDER BARU</h2>

<label>Cari Pelanggan / Kendaraan</label>

<div class="row">

<input
id="platNomor"
class="flex1"
placeholder="Nomor Polisi, No HP, atau Nama Pelanggan">

<button
type="button"
class="searchBtn"
onclick="cariKendaraan()">

🔍 Cari

</button>
</div>

<div id="hasilCari"
style="
margin-top:8px;
border:1px solid #ddd;
border-radius:6px;
display:none;
max-height:220px;
overflow-y:auto;
background:#fff;
">
</div>

<label>Nama Pelanggan</label>

<input
id="namaPelanggan"
readonly>

<input type="hidden" id="idPelanggan">

<input type="hidden" id="idKendaraan">

<label>Kendaraan</label>

<input
id="kendaraan"
readonly>

<label>No HP</label>

<input
id="nohp"
readonly>

<label>KM</label>

<input
type="number"
id="km">

<label>Keluhan</label>

<textarea
id="keluhan"
rows="3"></textarea>

<label>Catatan Tambahan</label>

<textarea
rows="3"
id="catatan"></textarea>

<label>Mekanik</label>

<select id="mekanik"></select>

<label>Prioritas</label>

<select id="prioritas">

<option>NORMAL</option>

<option>URGENT</option>

<option>GARANSI</option>

</select>

<button
type="button"
id="btnSimpanWO"
class="btn-full"
onclick="simpanWorkOrder()">

SIMPAN WORK ORDER

</button>
</div>

<script>

function cariPlat() {

  const plat =
    document.getElementById("platNomor").value.trim();

  if(!plat){

    alert("Nomor polisi belum diisi.");

    return;

  }

  google.script.run

    .withSuccessHandler(function(data){

      if(!data){

        alert("Plat nomor tidak ditemukan.");

        return;

      }

      document.getElementById("namaPelanggan").value =
        data.nama || "";

      document.getElementById("nohp").value = data.nohp || "";

      document.getElementById("kendaraan").value =
        (data.merk || "") +
        " " +
        (data.model || "");

      document.getElementById("idPelanggan").value =
        data.idPelanggan || "";

      document.getElementById("idKendaraan").value =
        data.idKendaraan || "";

      document.getElementById("platNomor").value =
        data.plat || plat;

      if(document.getElementById("km")){

        document.getElementById("km").value =
          data.kilometer || "";

      }

    })

    .withFailureHandler(function(err){

      alert(
        "ERROR: " +
        (err.message || err)
      );

    })

    .findKendaraanByPlat(plat);

}


/**
 * ============================================
 * INIT FORM
 * ============================================
 */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadMekanik();

    document
      .getElementById("platNomor")
      .addEventListener(
        "input",
        function(){

          const keyword =
            this.value.trim();

          if(keyword.length < 2){

            document
              .getElementById("hasilCari")
              .style.display = "none";

            return;

          }

          cariKendaraan();

        }
      );

  }
);


/**
 * ============================================
 * SEARCH KENDARAAN
 * ============================================
 */

let searchKendaraanRequest = 0;
function cariKendaraan(){

  const keyword =
    document
      .getElementById("platNomor")
      .value
      .trim();

  if(keyword === ""){

    return;

  }

  const requestId =
    ++searchKendaraanRequest;


  google.script.run

    .withSuccessHandler(
      function(list){

        /*
         * Abaikan response pencarian
         * yang sudah tidak relevan.
         */
        if(
          requestId !==
          searchKendaraanRequest
        ){

          return;

        }

        renderHasilCari(list);

      }
    )

    .withFailureHandler(
      function(err){

        console.error(err);

      }
    )

    .searchKendaraan(keyword);

}


/**
 * ============================================
 * LOAD MEKANIK
 * ============================================
 *
 * Untuk tahap ini mekanik masih ditampilkan
 * di form, tetapi BELUM disimpan ke header WO.
 *
 * Mekanik nantinya disimpan pada
 * WorkOrderJasa.
 * ============================================
 */

function loadMekanik(){

  google.script.run

    .withSuccessHandler(
      function(data){

        renderMekanik(data);

      }
    )

    .withFailureHandler(
      function(err){

        alert(
          err.message || err
        );

      }
    )

    .getMasterMekanik();

}


function renderMekanik(data){

  const select =
    document.getElementById("mekanik");

  select.innerHTML = "";

  const kosong =
    document.createElement("option");

  kosong.value = "";

  kosong.textContent =
    "-- Pilih Mekanik --";

  select.appendChild(kosong);

  data.forEach(
    function(row){

      const option =
        document.createElement("option");

      option.value =
        row[0];

      option.textContent =
        row[1];

      select.appendChild(option);

    }
  );

}


/**
 * ============================================
 * RENDER HASIL PENCARIAN
 * ============================================
 */

function renderHasilCari(list){

  const box =
    document.getElementById(
      "hasilCari"
    );

  box.innerHTML = "";

  if(!list || list.length === 0){

    box.style.display =
      "none";

    return;

  }

  box.style.display =
    "block";

  list.forEach(
    function(item){

      const div =
        document.createElement("div");

      div.style.padding =
        "10px";

      div.style.cursor =
        "pointer";

      div.style.borderBottom =
        "1px solid #eeeeee";

      div.innerHTML =

        "<div style='font-weight:bold'>" +
        (item.nama || "") +
        "</div>" +

        "<div style='font-size:13px;color:#666'>" +

        (item.plat || "") +

        " • " +

        (item.merk || "") +

        " " +

        (item.model || "") +

        "</div>";

      div.onmouseover =
        function(){

          div.style.background =
            "#f5f5f5";

        };

      div.onmouseout =
        function(){

          div.style.background =
            "white";

        };

      div.onclick =
        function(){

          pilihKendaraan(item);

        };

      box.appendChild(div);

    }
  );

}


/**
 * ============================================
 * PILIH KENDARAAN
 * ============================================
 */

function pilihKendaraan(data){

  /*

   * Membatalkan response pencarian

   * yang masih berjalan.

   */

  searchKendaraanRequest++;

  document.getElementById("platNomor").value =
    data.plat || "";

  document.getElementById("idPelanggan").value =
    data.idPelanggan || "";

  document.getElementById("idKendaraan").value =
    data.idKendaraan || "";

  document.getElementById("namaPelanggan").value =
    data.nama || "";

  document.getElementById("nohp").value =
    data.noHp || ""; 

  document.getElementById("kendaraan").value =
    (
      (data.merk || "") +
      " " +
      (data.model || "")
    ).trim();

  document.getElementById("km").value =
    data.kilometer || "";

  document.getElementById("hasilCari").style.display =
    "none";

}


/**
 * ============================================
 * SIMPAN WORK ORDER
 * ============================================
 *
 * MENGGUNAKAN ARSITEKTUR BARU:
 *
 * Form
 *   ↓
 * WorkOrderService.create()
 *   ↓
 * WorkOrderDocument
 *   ↓
 * WorkOrderRepository
 *   ↓
 * 17_WorkOrder
 *
 * TIDAK LAGI:
 *
 * saveWorkOrder()
 *
 * ============================================
 */

let isSavingWorkOrder = false;

function simpanWorkOrder(){

  // ============================================
  // CEGAH DOUBLE CLICK
  // ============================================

  if(isSavingWorkOrder){

    return;

  }


  // ============================================
  // AMBIL DATA FORM
  // ============================================

  const customerId =
    document
      .getElementById("idPelanggan")
      .value
      .trim();


  const vehicleId =
    document
      .getElementById("idKendaraan")
      .value
      .trim();


  const km =
    document
      .getElementById("km")
      .value;


  const prioritas =
    document
      .getElementById("prioritas")
      .value;


  const catatan =
    document
      .getElementById("catatan")
      .value
      .trim();


  const keluhan =
    document
      .getElementById("keluhan")
      .value
      .trim();


  // ============================================
  // VALIDASI FORM
  // ============================================

  if(!customerId){

    alert(
      "Pelanggan belum dipilih."
    );

    return;

  }


  if(!vehicleId){

    alert(
      "Kendaraan belum dipilih."
    );

    return;

  }


  // ============================================
  // MULAI PROSES SIMPAN
  // ============================================

  isSavingWorkOrder = true;


  const btn =
    document.getElementById("btnSimpanWO");


  if(btn){

    btn.disabled = true;

    btn.dataset.originalText =
      btn.innerHTML;

    btn.innerHTML =
      "⏳ MENYIMPAN...";

  }


  /**
   * ========================================
   * CATATAN SEMENTARA
   * ========================================
   *
   * Schema 17_WorkOrder baru tidak mempunyai
   * kolom Keluhan.
   *
   * Keluhan secara arsitektur akan disimpan
   * pada 18_WorkOrderJasa.
   *
   * Karena form jasa belum menjadi bagian
   * dari tahap ini, keluhan kita pertahankan
   * sementara di Catatan agar TIDAK HILANG.
   *
   * Nanti saat Detail WO sudah menggunakan
   * WorkOrderJasa, bagian ini akan dipindahkan
   * ke mekanisme yang benar.
   * ========================================
   */

  let finalCatatan =
    catatan;


  if(keluhan){

    finalCatatan =

      "Keluhan: " +
      keluhan +
      (
        catatan
          ? "\nCatatan: " + catatan
          : ""
      );

  }


  /**
   * ========================================
   * REQUEST CANONICAL
   * ========================================
   */

  const request = {

    customerId :
      customerId,

    vehicleId :
      vehicleId,

    kilometerMasuk :
      Number(km || 0),

    prioritas :
      prioritas,

    catatan :
      finalCatatan,

    jenisTransaksi :
      "SERVICE",

    admin :
      ""

  };


  /**
   * ========================================
   * SIMPAN
   * ========================================
   */

  google.script.run

   .withSuccessHandler(
  function(result){

    google.script.run
      .withSuccessHandler(
        function(){

          google.script.host.close();

        }
      )
      .withFailureHandler(
        function(){

          /*
           * Jika notifikasi gagal dicatat,
           * WO tetap sudah berhasil dibuat.
           * Jadi form tetap ditutup.
           */

          google.script.host.close();

        }
      )
      .setPendingWorkOrderToast(
        result.workOrderId
      );

  }
)

    .withFailureHandler(
  function(err){

    isSavingWorkOrder = false;

    const btn =
      document.getElementById("btnSimpanWO");

    btn.disabled = false;

    btn.textContent =
      "SIMPAN WORK ORDER";

    alert(
      "❌ Gagal membuat Work Order\n\n" +
      (
        err.message ||
        err
      )
    );

  }
)

   .createWorkOrder(
  request
);

}

</script>

</body>

</html>
