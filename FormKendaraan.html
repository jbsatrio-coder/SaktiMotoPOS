<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 18px;
      color: #222;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 12px;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: white;
    }

    button {
      margin-top: 22px;
      padding: 10px 18px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #simpan {
      background: #222;
      color: white;
    }

    #batal {
      margin-left: 6px;
    }

    #status {
      margin-top: 14px;
      font-size: 13px;
    }

    .required {
      color: #c00;
    }

    .optional {
      color: #777;
      font-size: 11px;
      font-weight: normal;
    }
  </style>
</head>

<body>

<h2>Tambah Kendaraan</h2>

<label>
  Plat Nomor <span class="required">*</span>
</label>

<input
  id="plat"
  placeholder="B 1234 ABC"
  autocomplete="off"
>

<label>
  Merk <span class="required">*</span>
</label>

<select id="merk" onchange="loadModel()">
  <option value="">Memuat Merk...</option>
</select>

<label>
  Model <span class="required">*</span>
</label>

<select id="model" disabled>
  <option value="">Pilih Merk terlebih dahulu</option>
</select>

<label>
  Tahun
  <span class="optional">(optional)</span>
</label>

<input
  id="tahun"
  type="number"
  placeholder="2022"
>

<label>
  Warna
  <span class="optional">(optional)</span>
</label>

<input
  id="warna"
  placeholder="Hitam"
>

<label>
  Nomor Mesin
  <span class="optional">(optional)</span>
</label>

<input
  id="noMesin"
  placeholder="Boleh dikosongkan"
  autocomplete="off"
>

<label>
  Nomor Rangka
  <span class="optional">(optional)</span>
</label>

<input
  id="noRangka"
  placeholder="Boleh dikosongkan"
  autocomplete="off"
>

<button
  id="simpan"
  onclick="simpan()"
>
  SIMPAN
</button>

<button
  id="batal"
  onclick="google.script.host.close()"
>
  BATAL
</button>

<div id="status"></div>

<script>

let daftarMerk = [];

/**
 * ============================================
 * WORK ORDER VEHICLE CONTEXT
 * ============================================
 */

let workOrderCustomerId = "";

function loadWorkOrderVehicleContext() {

  google.script.run

    .withSuccessHandler(function(data) {

      if(data && data.customerId) {

        workOrderCustomerId =
          String(data.customerId).trim();

      }

    })

    .withFailureHandler(function(error) {

      console.error(
        "Gagal mengambil context Work Order:",
        error
      );

    })

    .getPendingWorkOrderVehicle();

}


/**
 * ============================================
 * LOAD MASTER MERK
 * ============================================
 */

function loadMerk() {

  const select =
    document.getElementById("merk");

  select.innerHTML =
    '<option value="">Memuat Merk...</option>';

  google.script.run

    .withSuccessHandler(function(data) {

      daftarMerk =
        data || [];

      select.innerHTML =
        '<option value="">-- Pilih Merk --</option>';

      daftarMerk.forEach(function(item) {

        const option =
          document.createElement("option");

        option.value =
          item.id || "";

        option.textContent =
          item.nama || "";

        select.appendChild(option);

      });

    })

    .withFailureHandler(function(error) {

      select.innerHTML =
        '<option value="">Gagal memuat Merk</option>';

      document.getElementById("status").innerHTML =
        "Gagal memuat Master Merk: " +
        (error.message || error);

    })

    .getMasterMerkKendaraan();

}


/**
 * ============================================
 * LOAD MODEL BERDASARKAN MERK
 * ============================================
 */

function loadModel() {

  const merkId =
    document
      .getElementById("merk")
      .value;

  const select =
    document.getElementById("model");

  select.innerHTML =
    '<option value="">Memuat Model...</option>';

  select.disabled = true;

  if(!merkId) {

    select.innerHTML =
      '<option value="">Pilih Merk terlebih dahulu</option>';

    return;

  }

  google.script.run

    .withSuccessHandler(function(data) {

      const models =
        data || [];

      select.innerHTML =
        '<option value="">-- Pilih Model --</option>';

      models.forEach(function(item) {

        const option =
          document.createElement("option");

        option.value =
          item.id || "";

        option.textContent =
          item.nama || "";

        select.appendChild(option);

      });

      select.disabled =
        false;

    })

    .withFailureHandler(function(error) {

      select.innerHTML =
        '<option value="">Gagal memuat Model</option>';

      select.disabled =
        true;

      document.getElementById("status").innerHTML =
        "Gagal memuat Master Model: " +
        (error.message || error);

    })

    .getMasterModelKendaraan(merkId);

}


/**
 * ============================================
 * SIMPAN
 * ============================================
 */

function simpan() {

  const tombol =
    document.getElementById("simpan");

  const status =
    document.getElementById("status");

  const data = {

    customerId:
      workOrderCustomerId,

    plat:
      document.getElementById("plat").value,

    /*
     * Backend sekarang mengharapkan
     * nama merk/model untuk resolve.
     * ID tetap dikirim juga agar struktur
     * form siap untuk evolusi berikutnya.
     */

    merk:
      document
        .getElementById("merk")
        .selectedOptions[0]
        ?.textContent || "",

    merkId:
      document
        .getElementById("merk")
        .value,

    model:
      document
        .getElementById("model")
        .selectedOptions[0]
        ?.textContent || "",

    modelId:
      document
        .getElementById("model")
        .value,

    tahun:
      document.getElementById("tahun").value,

    warna:
      document.getElementById("warna").value,

    noMesin:
      document.getElementById("noMesin").value,

    noRangka:
      document.getElementById("noRangka").value

  };


  /**
   * ==========================================
   * VALIDASI
   * ==========================================
   */

  if(!data.plat.trim()) {

    status.innerHTML =
      "Plat nomor wajib diisi.";

    return;

  }

  if(!data.merkId) {

    status.innerHTML =
      "Merk wajib dipilih.";

    return;

  }

  if(!data.modelId) {

    status.innerHTML =
      "Model wajib dipilih.";

    return;

  }


  tombol.disabled =
    true;

  status.innerHTML =
    "Menyimpan kendaraan...";


  google.script.run

    .withSuccessHandler(function(result) {

      status.innerHTML =
        "Kendaraan " +
        result.plat +
        " berhasil ditambahkan.";

      /*
       * Jika FormKendaraan dibuka dari Work Order,
       * kirim kendaraan baru kembali ke Work Order.
       */
      if(workOrderCustomerId) {

        google.script.run
          .withFailureHandler(function(error) {

            console.error(
              "Gagal mengirim kendaraan baru ke Work Order:",
              error
            );

          })
          .setPendingWorkOrderVehicle(result);

      }

      setTimeout(function() {

        google.script.host.close();

      }, 700);

    })

    .withFailureHandler(function(error) {

      status.innerHTML =
        "Gagal: " +
        (error.message || error);

      tombol.disabled =
        false;

    })

    .simpanKendaraanBaru(data);

}


/**
 * ============================================
 * INITIALIZE
 * ============================================
 */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadWorkOrderVehicleContext();

    loadMerk();

  }
);

</script>

</body>
</html>
