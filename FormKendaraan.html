<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 18px;
      color: #222;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 12px;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      border: 1px solid #bbb;
      border-radius: 4px;
    }

    button {
      margin-top: 22px;
      padding: 10px 18px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    #simpan {
      background: #222;
      color: white;
    }

    #batal {
      margin-left: 6px;
    }

    #status {
      margin-top: 14px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<h2>Tambah Kendaraan</h2>

<label>Plat Nomor *</label>
<input
  id="plat"
  placeholder="B 1234 ABC"
  autocomplete="off"
>

<label>Merk</label>
<input
  id="merk"
  placeholder="Honda"
>

<label>Model</label>
<input
  id="model"
  placeholder="Vario 125"
>

<label>Tahun</label>
<input
  id="tahun"
  type="number"
  placeholder="2022"
>

<label>Warna</label>
<input
  id="warna"
  placeholder="Hitam"
>

<button id="simpan" onclick="simpan()">
  SIMPAN
</button>

<button
  id="batal"
  onclick="google.script.host.close()"
>
  BATAL
</button>

<div id="status"></div>

<script>

function simpan() {

  const tombol =
    document.getElementById("simpan");

  const status =
    document.getElementById("status");

  const data = {
    plat:
      document.getElementById("plat").value,

    merk:
      document.getElementById("merk").value,

    model:
      document.getElementById("model").value,

    tahun:
      document.getElementById("tahun").value,

    warna:
      document.getElementById("warna").value
  };

  if (!data.plat.trim()) {
    status.innerHTML =
      "Plat nomor wajib diisi.";
    return;
  }

  tombol.disabled = true;
  status.innerHTML =
    "Menyimpan kendaraan...";

  google.script.run

    .withSuccessHandler(function(result) {

      status.innerHTML =
        "Kendaraan " +
        result.plat +
        " berhasil ditambahkan.";

      setTimeout(function() {
        google.script.host.close();
      }, 700);

    })

    .withFailureHandler(function(error) {

      status.innerHTML =
        "Gagal: " + error.message;

      tombol.disabled = false;

    })

    .simpanKendaraanBaru(data);
}

</script>

</body>
</html>
