<script>


let allWO = [];

/**
 * ============================================
 * LOAD DASHBOARD
 * ============================================
 */

window.onload = function(){

  loadWorkOrder();

  // Cek langsung
  checkPendingWorkOrderToast();

  // Kemudian cek berkala
  setInterval(
    checkPendingWorkOrderToast,
    1000
  );

};


/**
 * ============================================
 * LOAD WORK ORDER
 * ============================================
 */

function loadWorkOrder(){

  google.script.run

    .withSuccessHandler(
  function(data){

    allWO =
      data || [];

    updateSummary(
      allWO
    );

    renderWO(
      allWO
    );

  }
)

    .withFailureHandler(
      function(err){

        console.error(
          "Gagal memuat Work Order:",
          err
        );

      }
    )

    .getAllWorkOrder();

}

function updateSummary(data){

  let menunggu = 0;
  let proses = 0;
  let qc = 0;
  let selesai = 0;


  (data || []).forEach(function(wo){

    const status =
      String(
        wo.status || ""
      )
      .trim()
      .toUpperCase();


    // ==========================================
    // MENUNGGU
    //
    // Kategori dashboard:
    // MENUNGGU_DIAGNOSA
    // MENUNGGU_APPROVAL
    //
    // DRAFT TIDAK DIHITUNG
    // ==========================================

    if(
      status === "MENUNGGU_DIAGNOSA" ||
      status === "MENUNGGU_APPROVAL"
    ){

      menunggu++;

    }


    // ==========================================
    // PROSES
    //
    // DALAM_PENGERJAAN
    // MENUNGGU_SPAREPART
    // ==========================================

    else if(
      status === "DALAM_PENGERJAAN" ||
      status === "MENUNGGU_SPAREPART"
    ){

      proses++;

    }


    // ==========================================
    // QC
    //
    // Disiapkan untuk status QC.
    // ==========================================

    else if(
      status === "QC"
    ){

      qc++;

    }


    // ==========================================
    // SELESAI
    // ==========================================

    else if(
      status === "SELESAI"
    ){

      selesai++;

    }

  });


  // ==========================================
  // UPDATE SUMMARY UI
  // ==========================================

  document.getElementById(
    "sumMenunggu"
  ).textContent =
    menunggu;


  document.getElementById(
    "sumProses"
  ).textContent =
    proses;


  document.getElementById(
    "sumQC"
  ).textContent =
    qc;


  document.getElementById(
    "sumSelesai"
  ).textContent =
    selesai;

}


/**
 * ============================================
 * CEK NOTIFIKASI WO BARU
 * ============================================
 */

function checkPendingWorkOrderToast(){

  console.log(
    "CHECK PENDING TOAST"
  );

  google.script.run

    .withSuccessHandler(
      function(data){

        console.log(
          "PENDING TOAST RESULT:",
          data
        );

        if(
          data &&
          data.workOrderId
        ){

          console.log(
            "TOAST DITEMUKAN:",
            data.workOrderId
          );

          tampilkanToastWO(
            data.workOrderId
          );

        }

      }
    )

    .withFailureHandler(
      function(err){

        console.error(
          "GAGAL GET PENDING TOAST:",
          err
        );

      }
    )

    .getPendingWorkOrderToast();

}


/**
 * ============================================
 * TOAST WORK ORDER
 * ============================================
 */

function tampilkanToastWO(
  workOrderId
){

  /*
   * Jangan buat toast jika ID kosong.
   */

  if(!workOrderId){

    return;

  }


  /*
   * Hapus toast lama jika ada.
   */

  const oldToast =
    document.getElementById(
      "woSuccessToast"
    );

  if(oldToast){

    oldToast.remove();

  }


  const toast =
    document.createElement(
      "div"
    );

  toast.id =
    "woSuccessToast";

  toast.innerHTML =

    `
      <div class="wo-toast-icon">
        ✓
      </div>

      <div>

        <div class="wo-toast-title">
          Work Order berhasil dibuat
        </div>

        <div class="wo-toast-id">
          ${workOrderId}
        </div>

      </div>
    `;


  document.body.appendChild(
    toast
  );


  /*
   * Tampilkan
   */

  requestAnimationFrame(
    function(){

      toast.classList.add(
        "show"
      );

    }
  );


  /*
   * Hilangkan otomatis
   */

  setTimeout(
    function(){

      toast.classList.remove(
        "show"
      );

      setTimeout(
        function(){

          toast.remove();

        },
        300
      );

    },
    3500
  );

}


/**
 * Filter Search
 */
function filterWO() {

  const key = document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();

  if (key == "") {

    renderWO(allWO);

    return;

  }

  const hasil = allWO.filter(function (r) {

    return (

      String(r.nama || "").toLowerCase().includes(key)

      ||

      String(r.plat || "").toLowerCase().includes(key)

      ||

      String(r.hp || "").toLowerCase().includes(key)

      ||

      String(r.noWO || "").toLowerCase().includes(key)

    );

  });

  renderWO(hasil);

}


/**
 * Render Card
 */
function renderWO(data) {

// - MENUNGGU_DIAGNOSA
// - MENUNGGU_APPROVAL
// - DALAM_PENGERJAAN
// - MENUNGGU_SPAREPART
// - SELESAI
//
// DRAFT tidak masuk antrean.
// SUDAH_DIAMBIL dan DIBATALKAN juga tidak.
//
// ============================================

const activeStatuses = [

  "MENUNGGU_DIAGNOSA",

  "MENUNGGU_APPROVAL",

  "DALAM_PENGERJAAN",

  "MENUNGGU_SPAREPART",

  "SELESAI"

];

  data.filter(function(wo){

    const status =
      String(
        wo.status || ""
      )
      .trim()
      .toUpperCase();

    return status === "DRAFT";

  });


const visibleData =
  data.filter(function(wo){

    const status =
      String(
        wo.status || ""
      )
      .trim()
      .toUpperCase();

    return activeStatuses.includes(
      status
    );

  });


// ============================================
// JUMLAH DRAFT
// ============================================

const draftCount =
  draftData.length;


  // ============================================
  // SORTING ANTRIAN
  //
  // 1. URGENT lebih dahulu
  // 2. Dalam priority yang sama,
  //    WO paling lama lebih dahulu
  // ============================================

    function(a,b){

        )
        .trim()
        .toUpperCase();

        String(
          b.prioritas || ""
        )
        .trim()
        .toUpperCase();

        priorityA === "URGENT"

        priorityB === "URGENT"

          : 0;

      // ========================================

}

function getWOTimeValue(wo){

  const raw =
    String(
      wo.dibuatPada || ""
    ).trim();


  if(!raw){

    return 0;

  }


  const value =
    new Date(raw).getTime();


  if(
    isNaN(value)
  ){

    return 0;

  }


  return value;

}


function formatWOAge(
  masukTime
){

  if(!masukTime){

    return "-";

  }


  const diff =
    Math.max(
      0,
      Date.now() - masukTime
    );


  const totalMinutes =
    Math.floor(
      diff / 60000
    );


  const days =
    Math.floor(
      totalMinutes / 1440
    );


  const hours =
    Math.floor(
      (
        totalMinutes % 1440
      ) / 60
    );


  const minutes =
    totalMinutes % 60;


  if(days > 0){

    return (
      days +
      " hari " +
      hours +
      " jam"
    );

  }


  if(hours > 0){

    return (
      hours +
      " jam " +
      minutes +
      " mnt"
    );

  }


  return (
    minutes +
    " menit"
  );

}


function isWOInap(
  masukTime
){

  if(!masukTime){

    return false;

  }


  const diff =
    Date.now() -
    masukTime;


  // Lebih dari 24 jam

  return diff >=
    (
      24 *
      60 *
      60 *
      1000
    );

}


function formatWOMasuk(wo){

  const raw =
    String(
      wo.dibuatPada || ""
    ).trim();


  if(!raw){

    return "-";

  }


  const date =
    new Date(raw);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return escapeHtmlWO(
      raw
    );

  }


  const tanggal =
    String(
      date.getDate()
    ).padStart(2,"0") +
    "/" +
    String(
      date.getMonth() + 1
    ).padStart(2,"0") +
    "/" +
    date.getFullYear();


  const jam =
    String(
      date.getHours()
    ).padStart(2,"0") +
    ":" +
    String(
      date.getMinutes()
    ).padStart(2,"0");


  return (
    tanggal +
    " " +
    jam
  );

}

/**
 * Buka Detail
 */

function getStatusClass(status){

  switch(String(status).toUpperCase()){

    case "MENUNGGU":
      return "status-menunggu";

    case "DIAGNOSA":
      return "status-diagnosa";

    case "MENUNGGU APPROVAL":
      return "status-approval";

    case "PROSES":
      return "status-proses";

    case "QC":
      return "status-qc";

    case "SIAP DIAMBIL":
    case "SELESAI":
      return "status-selesai";

    default:
      return "";

  }

}

            );

            openJasa.map(function(item){

                  "wojKeluhan_" +
                  item.id
                );


              const diagnosaEl =
                document.getElementById(

                document.getElementById(

                  item.id
                );

                    ? mekanikEl.value
                    : (
                        item.mekanikId || ""
                      )

              };

            });

            "⏳ MENYIMPAN...";

            function(index){

                index >= payloads.length
              ){

                button.disabled = false;

                button.innerText =
                  "💾 SIMPAN PERUBAHAN";


                alert(

                bukaDetailWO(

                  function(err){

                      (index + 1) +

                        err.message

                          : err
                      )
                    );

                )

                .updateWorkOrderJasaFromDashboard(
                  payloads[index]
                );

            };


          saveOne(0);

        };



    })

        err.message
      );

function buildMekanikOptionsWO(
  mekanikList,
  selectedId
){

  let html = `
    <option value="">
      -- Pilih Mekanik --
    </option>
  `;

  (mekanikList || []).forEach(function(row){

    const id =
      String(row[0] || "");

    const nama =
      String(row[1] || "");

    if(!id || !nama){
      return;
    }

    html += `
      <option
        value="${escapeHtmlWO(id)}"
        ${id === String(selectedId || "") ? "selected" : ""}
      >
        ${escapeHtmlWO(nama)}
      </option>
    `;

  });

  return html;

}


function escapeHtmlWO(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function renderHasilJasaWO(
  daftar
){

  const container =
    document.getElementById(
      "tambahJasaResults"
    );

  if(!container){
    return;
  }

  container.innerHTML = "";

  if(!daftar || !daftar.length){

    container.style.display =
      "none";

    return;

  }

  daftar.forEach(
    function(item){

      const div =
        document.createElement(
          "div"
        );

      div.style.cssText = `
        padding:11px 13px;
        border-bottom:1px solid #eee;
        cursor:pointer;
        background:white;
      `;

      div.innerHTML = `
        <div style="
          font-weight:600;
          font-size:14px;
        ">
          ${escapeHtmlWO(item.nama)}
        </div>

        <div style="
          color:#777;
          font-size:12px;
          margin-top:3px;
        ">
          Rp ${Number(
            item.harga || 0
          ).toLocaleString("id-ID")}
        </div>
      `;

      div.onmouseenter =
        function(){
          div.style.background =
            "#f5f5f5";
        };

      div.onmouseleave =
        function(){
          div.style.background =
            "white";
        };

      div.onclick =
        function(){

          pilihJasaUntukWO(
            item
          );

        };

      container.appendChild(
        div
      );

    }
  );

  container.style.display =
    "block";

}

function filterJasaWO(
  keyword
){

  const daftar =
    window.daftarJasaWO || [];

  const q =
    String(
      keyword || ""
    )
    .trim()
    .toLowerCase();

  if(!q){

    renderHasilJasaWO(
      []
    );

    return;

  }

  const hasil =
    daftar.filter(
      function(item){

        return String(
          item.nama || ""
        )
        .toLowerCase()
        .includes(q);

      }
    );

  renderHasilJasaWO(
    hasil
  );

}

function pilihJasaUntukWO(
  item
){

  document.getElementById(
    "tambahJasaId"
  ).value =
    item.id || "";

  document.getElementById(
    "tambahJasaSearch"
  ).value =
    item.nama || "";

  document.getElementById(
    "tambahJasaHarga"
  ).value =
    "Rp " +
    Number(
      item.harga || 0
    ).toLocaleString(
      "id-ID"
    );

  document.getElementById(
    "tambahJasaResults"
  ).style.display =
    "none";

}
