<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      color: #222;
      background: #f7f7f7;
      font-size: 13px;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 20px;
    }

    .section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin-top: 8px;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: bold;
      color: #555;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 13px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #888;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .col {
      flex: 1;
      min-width: 0;
    }

    button {
      padding: 8px 12px;
      border: 1px solid #bbb;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      background: #fff;
    }

    button:hover {
      background: #f2f2f2;
    }

    #tambah {
      margin-top: 10px;
      width: 100%;
    }

    #simpan {
      margin-top: 14px;
      width: 100%;
      padding: 11px;
      font-size: 13px;
    }

    .search-box {
      position: relative;
    }

    #cariBarang {
      font-size: 14px;
      padding: 10px;
    }

    #hasilBarang {
      margin-top: 8px;
      max-height: 230px;
      overflow-y: auto;
    }

    .barang-card {
      padding: 9px;
      margin-bottom: 6px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }

    .barang-card:hover {
      background: #f5f5f5;
      border-color: #aaa;
    }

    .barang-nama {
      font-weight: bold;
      font-size: 13px;
    }

    .barang-kode {
      margin-top: 2px;
      font-size: 10px;
      color: #777;
    }

    .barang-detail {
      margin-top: 3px;
      font-size: 11px;
      color: #555;
    }

    .barang-harga {
      margin-top: 3px;
      font-size: 11px;
    }

    #infoBarang {
      margin-top: 7px;
      padding: 8px;
      font-size: 11px;
      background: #f7f7f7;
      border-radius: 5px;
      line-height: 1.5;
    }

    #totalArea {
      margin-top: 10px;
      text-align: right;
      font-size: 16px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 11px;
      background: #fff;
    }

    th,
    td {
      border-bottom: 1px solid #ddd;
      padding: 7px 4px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      font-size: 10px;
      color: #666;
    }

    .angka {
      text-align: right;
    }

    .hapus {
      padding: 3px 6px;
      font-size: 10px;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.5;
    }

    #formSupplierBaru {
      padding: 10px;
      background: #f7f7f7;
      border-radius: 6px;
    }

    .muted {
      color: #777;
      font-size: 11px;
    }

  </style>
</head>

<body>

<h2>Pembelian / Stok Masuk</h2>

<!-- ======================================================
     INFORMASI PEMBELIAN
     ====================================================== -->

<div class="section">

  <div class="section-title">
    Informasi Pembelian
  </div>

  <div class="row">

    <div class="col">

      <label>Supplier *</label>

      <select id="supplier">
        <option value="">Memuat supplier...</option>
      </select>

      <button
        type="button"
        onclick="tampilkanFormSupplier()"
        style="margin-top:6px;"
      >
        + SUPPLIER BARU
      </button>

    </div>

    <div class="col">

      <label>No. Faktur</label>

      <input id="noFaktur">

    </div>

  </div>


  <label>Admin *</label>

  <input id="admin">


  <!-- FORM SUPPLIER BARU -->

  <div
    id="formSupplierBaru"
    style="display:none; margin-top:12px;"
  >

    <label>Nama Supplier *</label>
    <input id="supplierNama">

    <label>No. HP Supplier</label>
    <input id="supplierHP">

    <label>Alamat</label>
    <input id="supplierAlamat">

    <label>Nama Sales</label>
    <input id="supplierSales">

    <label>No. HP Sales</label>
    <input id="supplierHPSales">

    <label>Catatan</label>
    <input id="supplierCatatan">

    <button
      type="button"
      onclick="simpanSupplierDariForm()"
      style="margin-top:10px;"
    >
      SIMPAN SUPPLIER
    </button>

    <button
      type="button"
      onclick="tutupFormSupplier()"
      style="margin-top:6px;"
    >
      BATAL
    </button>

  </div>

</div>


<!-- ======================================================
     TAMBAH BARANG
     ====================================================== -->

<div class="section">

  <div class="section-title">
    Tambah Barang
  </div>

  <label>Cari Barang</label>

  <div class="search-box">

    <input
      id="cariBarang"
      type="text"
      placeholder="Ketik nama, kode, kata kunci, atau model motor..."
      oninput="filterBarang()"
      autocomplete="off"
    >

  </div>


  <div
    id="hasilBarang"
  ></div>


  <!--
    Tetap menggunakan id="barang".
    Field ini menyimpan KodeBarang terpilih.
  -->

  <input
    id="barang"
    type="hidden"
    value=""
  >


  <div id="infoBarang"></div>


  <div class="row">

    <div class="col">

      <label>Qty *</label>

      <input
        id="qty"
        type="number"
        min="1"
        value="1"
      >

    </div>


    <div class="col">

      <label>Harga Beli / pcs *</label>

      <input
        id="hargaBeli"
        type="number"
        min="0"
        step="1"
      >

    </div>

  </div>


  <button
    id="tambah"
    onclick="tambahItem()"
  >
    + TAMBAH ITEM
  </button>

</div>


<!-- ======================================================
     DAFTAR PEMBELIAN
     ====================================================== -->

<div class="section">

  <div class="section-title">
    Daftar Pembelian
  </div>

  <table>

    <thead>

      <tr>

        <th>Barang</th>

        <th class="angka">
          Qty
        </th>

        <th class="angka">
          Harga
        </th>

        <th class="angka">
          Subtotal
        </th>

        <th></th>

      </tr>

    </thead>

    <tbody id="keranjang"></tbody>

  </table>


  <div id="totalArea">
    TOTAL: Rp<span id="grandTotal">0</span>
  </div>

</div>


<label>Keterangan</label>
<textarea id="keterangan" rows="2"></textarea>


<button
  id="simpan"
  onclick="simpanPembelianMulti()"
>
  SIMPAN PEMBELIAN
</button>


<button
  style="margin-top:8px;width:100%;"
  onclick="google.script.host.close()"
>
  BATAL
</button>


<div id="status"></div>


<script>

let daftarBarang = [];
let items = [];
let daftarSupplier = [];

google.script.run

  .withSuccessHandler(function(data) {

    daftarSupplier = data;

    const select =
      document.getElementById("supplier");

    select.innerHTML =
      '<option value="">-- Pilih Supplier --</option>';

    data.forEach(function(item) {

      const option =
        document.createElement("option");

      // Legacy `13_Pembelian` retained NamaSupplier; modern purchase uses submitPurchase().
      option.value = item.nama;

      option.textContent =
        item.id + " - " + item.nama;

      select.appendChild(option);

    });

  })

  .withFailureHandler(function(error) {

    document.getElementById("status").innerHTML =
      "Gagal memuat supplier: " +
      error.message;

  })

  .getDaftarSupplier();


// ==========================================
// LOAD MASTER BARANG
// ==========================================

google.script.run

  .withSuccessHandler(function(data) {

    daftarBarang = Array.isArray(data)
      ? data
      : [];

    // Jangan tampilkan 159 barang saat form pertama dibuka.
    document.getElementById("hasilBarang")
      .innerHTML = "";

    document.getElementById("infoBarang")
      .innerHTML =
        daftarBarang.length +
        " barang tersedia. Ketik untuk mencari.";

  })

  .withFailureHandler(function(error) {

    document.getElementById("status").innerHTML =
      "Gagal memuat barang: " +
      error.message;

  })

  .getDaftarBarangPembelian();

function filterBarang() {

  const keyword =
    document.getElementById("cariBarang")
      .value
      .trim()
      .toLowerCase();

  const hasilContainer =
    document.getElementById("hasilBarang");

  const info =
    document.getElementById("infoBarang");

  const inputBarang =
    document.getElementById("barang");

  // Reset pilihan ketika pencarian berubah
  inputBarang.value = "";

  hasilContainer.innerHTML = "";

  // Jangan tampilkan semua barang ketika search kosong.
  if (!keyword) {

    info.innerHTML =
      daftarBarang.length +
      " barang tersedia. Ketik untuk mencari.";

    return;
  }

  // Pecah pencarian menjadi beberapa kata.
  const kataKunci =
    keyword
      .split(/\s+/)
      .filter(kata => kata !== "");

  const hasil =
    daftarBarang.filter(function(item) {

      const teks =
        [
          item.kode,
          item.nama,
          item.namaPendek,
          item.kataKunci,
          item.kompatibilitas
        ]
        .map(function(value) {
          return String(value || "").toLowerCase();
        })
        .join(" ");

      // Semua kata pencarian harus ditemukan.
      return kataKunci.every(function(kata) {

        return teks.includes(kata);

      });

    });

  info.innerHTML =
    hasil.length +
    " barang ditemukan";

  if (hasil.length === 0) {

    hasilContainer.innerHTML =
      '<div style="' +
      'padding:12px;' +
      'border:1px solid #ddd;' +
      'border-radius:6px;' +
      'background:#fafafa;' +
      'color:#777;' +
      '">' +
      'Barang tidak ditemukan.' +
      '</div>';

    return;
  }

  // Batasi hasil yang ditampilkan agar UI tetap ringan.
  const hasilTampil =
    hasil.slice(0, 30);

  hasilTampil.forEach(function(item) {

    const card =
      document.createElement("div");

    card.style.cssText =
      "padding:10px;" +
      "margin-bottom:7px;" +
      "border:1px solid #ddd;" +
      "border-radius:7px;" +
      "background:#fff;" +
      "cursor:pointer;";

    card.onmouseenter = function() {
      card.style.background = "#f5f5f5";
    };

    card.onmouseleave = function() {
      card.style.background = "#fff";
    };

    const kompatibilitas =
      String(
        item.kompatibilitas || ""
      ).trim();

    const kompatibilitasText =
      kompatibilitas
        ? "Kompatibilitas: " +
          kompatibilitas
        : "Kompatibilitas: Universal";

    card.innerHTML =

      '<div style="font-weight:bold;">' +
        escapeHtml_(item.nama) +
      '</div>' +

      '<div style="font-size:12px;color:#666;">' +
        escapeHtml_(item.kode) +
      '</div>' +

      '<div style="font-size:12px;margin-top:3px;">' +
        escapeHtml_(kompatibilitasText) +
      '</div>' +

      '<div style="font-size:12px;margin-top:3px;">' +
        'Stok: ' +
        Number(item.stok || 0).toLocaleString("id-ID") +
        ' | Harga modal: Rp' +
        formatRupiah_(
          item.hargaModal || 0
        ) +
      '</div>';

    card.onclick = function() {

      pilihBarang(item);

    };

    hasilContainer.appendChild(card);

  });

  if (hasil.length > 30) {

    const more =
      document.createElement("div");

    more.style.cssText =
      "padding:8px;" +
      "text-align:center;" +
      "color:#777;" +
      "font-size:12px;";

    more.textContent =
      "Menampilkan 30 dari " +
      hasil.length +
      " hasil. Persempit pencarian.";

    hasilContainer.appendChild(more);

  }

}


function pilihBarang(item) {

  const inputBarang =
    document.getElementById("barang");

  const hasilContainer =
    document.getElementById("hasilBarang");

  const info =
    document.getElementById("infoBarang");

  const hargaBeli =
    document.getElementById("hargaBeli");

  // Simpan KodeBarang.
  inputBarang.value =
    item.kode;

  // Tampilkan barang terpilih.
  info.innerHTML =
    "<b>" +
    escapeHtml_(item.nama) +
    "</b><br>" +

    "Kode: " +
    escapeHtml_(item.kode) +

    "<br>" +

    "Kompatibilitas: " +
    escapeHtml_(
      item.kompatibilitas ||
      "Universal"
    ) +

    "<br>" +

    "Stok: " +
    Number(item.stok || 0)
      .toLocaleString("id-ID") +

    " | Harga modal: Rp" +
    formatRupiah_(
      item.hargaModal || 0
    );

  // Harga modal menjadi default harga beli.
  hargaBeli.value =
    Number(item.hargaModal || 0);

  // Tutup hasil pencarian setelah memilih.
  hasilContainer.innerHTML = "";

}


function formatRupiah_(value) {

  const number =
    Number(value);

  if (!Number.isFinite(number)) {
    return "0";
  }

  return Math.round(number)
    .toLocaleString("id-ID");

}


function escapeHtml_(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function barangBerubah() {

  // Dipertahankan untuk kompatibilitas
  // dengan kode lama.

  const kode =
    document.getElementById("barang").value;

  const item =
    daftarBarang.find(
      x => x.kode === kode
    );

  if (!item) {

    document.getElementById("infoBarang")
      .innerHTML = "";

    return;

  }

  pilihBarang(item);

}


// ==========================================
// BARANG DIPILIH
// ==========================================
// TAMBAH ITEM KE KERANJANG
// ==========================================

function tambahItem() {

  const kode =
    document.getElementById("barang").value;

  const qty =
    Number(document.getElementById("qty").value);

  const harga =
    Number(
      document.getElementById("hargaBeli").value
    );

  const status =
    document.getElementById("status");


  if (!kode) {

    status.innerHTML =
      "Pilih barang terlebih dahulu.";

    return;
  }


  if (!qty || qty <= 0) {

    status.innerHTML =
      "Qty harus lebih dari 0.";

    return;
  }


  if (!harga || harga <= 0) {

    status.innerHTML =
      "Harga beli harus lebih dari 0.";

    return;
  }


  const barang =
    daftarBarang.find(
      x => x.kode === kode
    );


  if (!barang) {

    status.innerHTML =
      "Barang tidak ditemukan.";

    return;
  }


  // Cegah barang yang sama masuk dua kali
  const sudahAda =
    items.findIndex(
      x => x.kodeBarang === kode
    );


  if (sudahAda >= 0) {

    status.innerHTML =
      "Barang tersebut sudah ada di keranjang.";

    return;
  }


  items.push({

    kodeBarang: kode,

    namaBarang: barang.nama,

    qty: qty,

    hargaBeli: harga,

    subtotal: qty * harga

  });


  renderKeranjang();


  // Reset input item
  document.getElementById("cariBarang").value = "";
  document.getElementById("barang").value = "";
  document.getElementById("qty").value = 1;
  document.getElementById("hargaBeli").value = "";
  document.getElementById("infoBarang").innerHTML =
    "Barang berhasil ditambahkan ke keranjang.";

  document.getElementById("hasilBarang").innerHTML = "";

  // Fokus kembali ke pencarian.
  document.getElementById("cariBarang").focus();

status.innerHTML = "";

}


// ==========================================
// HAPUS ITEM
// ==========================================

function hapusItem(index) {

  items.splice(index, 1);

  renderKeranjang();

}


// ==========================================
// RENDER KERANJANG
// ==========================================

function renderKeranjang() {

  const tbody =
    document.getElementById("keranjang");

  tbody.innerHTML = "";

  let total = 0;


  items.forEach(function(item, index) {

    total += item.subtotal;


    const tr =
      document.createElement("tr");


    tr.innerHTML =

      "<td>" +
      item.namaBarang +
      "</td>" +

      '<td class="angka">' +
      item.qty +
      "</td>" +

      '<td class="angka">' +
      formatRupiah_(
        item.hargaBeli
      ) +
      "</td>" +

      '<td class="angka">' +
      formatRupiah_(
        item.subtotal
      ) +
      "</td>" +

      '<td>' +
      '<button class="hapus" ' +
      'onclick="hapusItem(' +
      index +
      ')">X</button>' +
      "</td>";


    tbody.appendChild(tr);

  });


  document.getElementById("grandTotal")
    .textContent =
      formatRupiah_(total);

}


// ==========================================
// SIMPAN
// Untuk sementara BELUM mengirim ke database.
// ==========================================

function simpanPembelianMulti() {

  const status =
    document.getElementById("status");

  const tombol =
    document.getElementById("simpan");


  const supplier =
    document.getElementById("supplier")
      .value.trim();

  const noFaktur =
    document.getElementById("noFaktur")
      .value.trim();

  const admin =
    document.getElementById("admin")
      .value.trim();

  const keterangan =
    document.getElementById("keterangan")
      .value.trim();


  // ==========================================
  // VALIDASI
  // ==========================================

  if (!supplier) {

    status.innerHTML =
      "Supplier wajib diisi.";

    return;
  }


  if (!admin) {

    status.innerHTML =
      "Admin wajib diisi.";

    return;
  }


  if (items.length === 0) {

    status.innerHTML =
      "Keranjang pembelian masih kosong.";

    return;
  }


  // ==========================================
  // DATA PURCHASE ENGINE
  // ==========================================

  const data = {

    supplier: supplier,

    noFaktur: noFaktur,

    admin: admin,

    keterangan: keterangan,

    items: items.map(function(item) {

      return {

        kodeBarang:
          item.kodeBarang,

        qty:
          Number(item.qty),

        hargaBeli:
          Number(item.hargaBeli)

      };

    })

  };


  tombol.disabled = true;

  status.innerHTML =
    "Menyimpan pembelian...";


  // ==========================================
  // PURCHASE ENGINE
  // ==========================================

  google.script.run

    .withSuccessHandler(function(result) {

      const totalQty =
        result.batchResult &&
        result.batchResult.results
          ? result.batchResult.results.reduce(
              function(total, movement) {
                return total +
                  Number(movement.qty || 0);
              },
              0
            )
          : 0;


      const total =
        items.reduce(
          function(total, item) {

            return total +
              (
                Number(item.qty || 0) *
                Number(item.hargaBeli || 0)
              );

          },
          0
        );


      status.innerHTML =
        "<b>PEMBELIAN BERHASIL</b><br><br>" +

        "No Pembelian: " +
        result.purchaseNumber +

        "<br>Status: " +
        result.status +

        "<br>Jumlah Item: " +
        items.length +

        "<br>Total Qty: " +
        totalQty +

        "<br>Total: Rp" +
        total.toLocaleString("id-ID");


      // ======================================
      // RESET KERANJANG
      // ======================================

      items = [];

      renderKeranjang();


      // ======================================
      // RESET INPUT TRANSAKSI
      // ======================================

      document.getElementById("supplier").value = "";

      document.getElementById("noFaktur").value = "";

      document.getElementById("keterangan").value = "";


      // Admin sengaja tetap
      // supaya tidak perlu mengetik berulang kali

      tombol.disabled = false;

    })

    .withFailureHandler(function(error) {

      status.innerHTML =
        "<b>GAGAL:</b> " +
        error.message;

      tombol.disabled = false;

    })

    .submitPurchase(data);

}

function tampilkanFormSupplier() {

  document.getElementById("formSupplierBaru")
    .style.display = "block";

  document.getElementById("supplierNama")
    .focus();
}


function tutupFormSupplier() {

  document.getElementById("formSupplierBaru")
    .style.display = "none";
}


function simpanSupplierDariForm() {

  const status =
    document.getElementById("status");

  const data = {

    nama:
      document.getElementById("supplierNama").value,

    noHP:
      document.getElementById("supplierHP").value,

    alamat:
      document.getElementById("supplierAlamat").value,

    sales:
      document.getElementById("supplierSales").value,

    noHPSales:
      document.getElementById("supplierHPSales").value,

    catatan:
      document.getElementById("supplierCatatan").value
  };


  if (!data.nama.trim()) {

    status.innerHTML =
      "Nama Supplier wajib diisi.";

    return;
  }


  status.innerHTML =
    "Menyimpan supplier...";


  google.script.run

    .withSuccessHandler(function(result) {

      // Tambahkan supplier baru ke data lokal
      daftarSupplier.push({
        id: result.id,
        nama: result.nama
      });


      // Tambahkan langsung ke dropdown
      const select =
        document.getElementById("supplier");

      const option =
        document.createElement("option");

      option.value = result.nama;

      option.textContent =
        result.id + " - " + result.nama;

      select.appendChild(option);


      // Langsung pilih supplier baru
      select.value = result.nama;


      // Kosongkan form
      document.getElementById("supplierNama").value = "";
      document.getElementById("supplierHP").value = "";
      document.getElementById("supplierAlamat").value = "";
      document.getElementById("supplierSales").value = "";
      document.getElementById("supplierHPSales").value = "";
      document.getElementById("supplierCatatan").value = "";


      // Tutup form supplier
      tutupFormSupplier();


      status.innerHTML =
        "Supplier " +
        result.nama +
        " berhasil ditambahkan.";

    })

    .withFailureHandler(function(error) {

      status.innerHTML =
        "Gagal: " + error.message;

    })

    .simpanSupplierBaru(data);

}

</script>
