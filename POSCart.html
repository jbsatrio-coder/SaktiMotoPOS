<script>

const POSCart = {

  cart: [],

  addItem(item){

    const existing = this.cart.find(x => x.kode === item.kode);

    if(existing){

      existing.qty++;
      existing.subtotal = existing.qty * existing.harga;

      return;

    }

    this.cart.push({

      kode: item.kode,
      nama: item.nama,
      jenis: item.jenis,

      harga: Number(item.harga),

      qty:1,

      subtotal:Number(item.harga)

    });

  },

  increaseQty(kode){

  const item = this.cart.find(x => x.kode === kode);

  if(!item) return;

  item.qty++;
  item.subtotal = item.qty * item.harga;

},

decreaseQty(kode){

  const item = this.cart.find(x => x.kode === kode);

  if(!item) return;

  item.qty--;

  if(item.qty <= 0){

    this.removeItem(kode);
    return;

  }

  item.subtotal = item.qty * item.harga;

},

removeItem(kode){

  this.cart = this.cart.filter(x => x.kode !== kode);

},

  getCart(){

    return this.cart;

  },

  clear(){

    this.cart=[];

  },

  getGrandTotal(){

    return this.cart.reduce((t,x)=>t+x.subtotal,0);

  },


getBarangTotal(){

  return this.cart
    .filter(x => x.jenis === "BARANG")
    .reduce((t, x) => t + x.subtotal, 0);

},

getJasaTotal(){

  return this.cart
    .filter(x => x.jenis === "JASA")
    .reduce((t, x) => t + x.subtotal, 0);

}
};

</script>
