<script>

const POSCart = {

  cart: [],

  canIncrease(item){

  // Jasa tidak memakai stok
  if(item.jenis !== "BARANG"){
    return true;
  }

  // Qty masih di bawah stok
  if(item.qty < item.stok){
    return true;
  }

  alert(
    "Stok tidak mencukupi.\n\n" +
    item.nama +
    "\n\nStok tersedia : " +
    item.stok
  );

  return false;

},

  addItem(item){

    if (!item) return;

    const existing = this.cart.find(x => x.kode === item.kode);

    if(existing){

        if(!this.canIncrease(existing)){
    return;
    }
      existing.qty++;
      existing.subtotal = existing.qty * existing.harga;

      return;

    }

    this.cart.push({

      kode: item.kode,
      nama: item.nama,
      jenis: item.jenis,

      harga: parseNumber(item.harga),

      stok: parseNumber(item.stok),

      qty:1,

      subtotal:parseNumber(item.harga)

    });

    console.log(this.cart);

  },

  increaseQty(kode){

  const item = this.cart.find(x => x.kode === kode);

  if(!item) return;

  if(!this.canIncrease(item)){
  return;
}

  item.qty++;
  item.subtotal = item.qty * item.harga;

},

decreaseQty(kode){

  const item = this.cart.find(x => x.kode === kode);

  if(!item) return;

  item.qty--;

  if(item.qty <= 0){

    this.removeItem(kode);
    return;

  }

  item.subtotal = item.qty * item.harga;

},

removeItem(kode){

  this.cart = this.cart.filter(x => x.kode !== kode);

},

  getCart(){

    return this.cart;

  },

  clear(){

    this.cart=[];

  },

  getGrandTotal(){

    return this.cart.reduce((t,x)=>t+x.subtotal,0);

  },


getBarangTotal(){

  return this.cart
    .filter(x => x.jenis === "BARANG")
    .reduce((t, x) => t + x.subtotal, 0);

},

getJasaTotal(){

  return this.cart
    .filter(x => x.jenis === "JASA")
    .reduce((t, x) => t + x.subtotal, 0);

}
};

</script>
