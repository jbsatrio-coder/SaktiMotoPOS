<style>

:root{

  --primary:#D32F2F;
  --primary-dark:#B71C1C;

  --success:#2E7D32;
  --warning:#F9A825;
  --info:#1976D2;
  --danger:#C62828;

  --bg:#F5F5F5;
  --card:#FFFFFF;
  --border:#E0E0E0;

  --text:#333333;
  --text-light:#757575;

  --radius:10px;

}

*{

box-sizing:border-box;

font-family:Arial,sans-serif;

}

body{

background:var(--bg);

margin:0;

padding:20px;

color:var(--text);

}

.card{

background:var(--card);

border-radius:var(--radius);

padding:18px;

margin-bottom:15px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.title{

font-size:24px;

font-weight:bold;

color:var(--primary);

margin-bottom:20px;

}

label{

display:block;

font-weight:bold;

margin-bottom:5px;

}

input,
select,
textarea{

width:100%;

padding:10px;

border:1px solid var(--border);

border-radius:8px;

font-size:14px;

}

button{

background:var(--primary);

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

font-weight:bold;

}

button:hover{

background:var(--primary-dark);

}

.btn-secondary{

background:#666;

}

.btn-success{

background:var(--success);

}

.badge{

display:inline-block;

padding:6px 12px;

border-radius:20px;

font-size:12px;

font-weight:bold;

}

.badge-warning{

background:#FFF3CD;

color:#856404;

}

.badge-success{

background:#D4EDDA;

color:#155724;

}

.badge-info{

background:#CCE5FF;

color:#004085;

}

.badge-purple{

background:#E2D6F5;

color:#5A2D82;

}

.flex{

display:flex;

}

.flex-between{

display:flex;

justify-content:space-between;

align-items:center;

}

.mt-10{

margin-top:10px;

}

.mt-20{

margin-top:20px;

}

.mb-10{

margin-bottom:10px;

}

.text-muted{

color:var(--text-light);

font-size:12px;

}

</style>
