<script>

function parseNumber(value){

  if(value === null || value === undefined) return 0;

  if(typeof value === "number") return value;

  return Number(
    String(value)
        .replace(/\./g, "")   // hapus titik ribuan
        .replace(/,/g, "")    // tetap dukung koma jika ada
        .trim()
) || 0;

}
// Cart dipindahkan ke POSCart
let searchResult = [];

const POSState = {

  pelanggan: {
    id: "PLG000001",
    nama: "TEST"
  },

  kendaraan: {
    id: "KND000001",
    platNomor: "B1234XYZ"
  },

  transaksi: {

    mekanikUtama: "MKN001",

    workOrder: "",

    metodeBayar: "TUNAI"

  }

};

window.onload = function () {

  const txtSearch = document.getElementById("search");

  txtSearch.focus();

  txtSearch.addEventListener("keyup", function () {
    doSearch(this.value);
  });

};

const txtPayment = document.getElementById("paymentAmount");

txtPayment.addEventListener("input", function(){

    const posisiCursor = this.selectionStart;

    this.value = formatNumber(this.value);

    this.setSelectionRange(
        this.value.length,
        this.value.length
    );

    updatePayment();

});

function rupiah(number) {

  return "Rp " + Number(number || 0).toLocaleString("id-ID");

}

function formatNumber(value){

    const angka = parseNumber(value);

    if (angka === 0) return "";

    return angka.toLocaleString("id-ID");

}

function doSearch(keyword) {

  keyword = String(keyword || "").trim();

  if (keyword == "") {

    document.getElementById("searchResult").innerHTML = "";

    return;

  }

  google.script.run

    .withSuccessHandler(function(data) {


    searchResult = data || [];

    renderSearch();

})

    .withFailureHandler(function (err) {

    console.error(err);

    // alert(err.message);

})

    .searchPOSProduct(keyword);

}

function renderSearch() {

  const div = document.getElementById("searchResult");

  div.innerHTML = "";

  if (searchResult.length == 0) {

    div.innerHTML = "<div class='text-muted'>Tidak ditemukan.</div>";

    return;

  }

  searchResult.forEach(function(item, index){

    div.innerHTML += `
      <div class="search-item"
           onclick="addToCart(${index})">

        <strong>${item.nama}</strong><br>

        <small>${item.jenis} | ${rupiah(item.harga)}</small>

      </div>
    `;

  });

}

function addToCart(index){

  POSCart.addItem(searchResult[index]);

  renderCart();

}

function renderCart(){

  const tbody = document.getElementById("cartBody");

  tbody.innerHTML = "";

  POSCart.getCart().forEach(function(item){

    tbody.innerHTML += `
      <tr>

        <td class="text-center align-middle">

          <div class="d-flex flex-column align-items-center">

            <button
              class="btn btn-sm btn-outline-success mb-1"
              onclick="increaseQty('${item.kode}')">
              +
            </button>

            <strong class="my-1">${item.qty}</strong>

            <button
              class="btn btn-sm btn-outline-danger mt-1"
              onclick="decreaseQty('${item.kode}')">
              −
            </button>

          </div>

        </td>

        <td>
          ${item.nama}
        </td>

        <td class="text-end">
          ${rupiah(item.harga)}
        </td>

        <td class="text-end fw-semibold">
          ${rupiah(item.subtotal)}
        </td>

        <td class="text-center">

          <button
            class="btn btn-sm btn-danger"
            onclick="removeItem('${item.kode}')">

            🗑

          </button>

        </td>

      </tr>
    `;

  });

  document.getElementById("barangTotal").innerHTML =
    rupiah(POSCart.getBarangTotal());

document.getElementById("jasaTotal").innerHTML =
    rupiah(POSCart.getJasaTotal());

document.getElementById("grandTotal").innerHTML =
    rupiah(POSCart.getGrandTotal());

 updatePayment();
 
}

function increaseQty(kode){

  POSCart.increaseQty(kode);

  renderCart();

}

function decreaseQty(kode){

  POSCart.decreaseQty(kode);

  renderCart();

}

function removeItem(kode){

  POSCart.removeItem(kode);

  renderCart();

}

function updatePayment(){

  const bayar = parseNumber(
    document.getElementById("paymentAmount").value
);

  const total = POSCart.getGrandTotal();

  const kembali = bayar - total;

  const btnSave = document.getElementById("btnSave");

  document.getElementById("changeAmount").innerHTML =
    rupiah(Math.max(kembali,0));

  // Jika tombol sudah ada, baru ubah statusnya
  updateSaveButton();

}
function saveTransaction() {

  const payload = {

    pelanggan: POSState.pelanggan,

    kendaraan: POSState.kendaraan,

    transaksi: {

      mekanikUtama:
        POSState.transaksi.mekanikUtama,

      workOrder:
        POSState.transaksi.workOrder,

      metodeBayar:
        POSState.transaksi.metodeBayar,

      diskonNota: 0,

      bayar: parseNumber(
    document.getElementById("paymentAmount").value
),

      admin: "TEST"

    },

    items: POSCart.getCart()

  };

  const btn = document.getElementById("btnSave");

btn.disabled = true;
btn.textContent = "Menyimpan...";
  google.script.run

  .withSuccessHandler(function(result){

    alert(
      "✅ Transaksi berhasil!\n\n" +
      result.noTransaksi
    );

    resetPOS();

})

  .withFailureHandler(function(err){

    btn.disabled = false;
    btn.textContent = "Simpan";

    alert(err.message);

    console.error(err);

})

  .savePOSTransaction(payload);

}
function resetPOS(){

    // Bersihkan textbox pencarian
    document.getElementById("search").value = "";

    // Bersihkan hasil pencarian
    doSearch("");

    // Reset pembayaran
    document.getElementById("paymentAmount").value = "";

    // Kosongkan keranjang
    POSCart.clear();

    // Render ulang cart (otomatis update total & tombol)
    renderCart();

    // Kembalikan teks tombol
    const btn = document.getElementById("btnSave");
    btn.textContent = "Simpan";

    // Fokus kembali ke pencarian
    setTimeout(function () {
        document.getElementById("search").focus();
    }, 100);

}

function updateSaveButton(){

    const btn = document.getElementById("btnSave");

    if (!btn) return;

    const total = POSCart.getGrandTotal();

   const bayar = parseNumber(
    document.getElementById("paymentAmount").value
);

    const adaItem = POSCart.getCart().length > 0;

    btn.disabled = !(adaItem && bayar >= total);

}
</script>
